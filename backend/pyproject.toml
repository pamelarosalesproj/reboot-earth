[project]
name = "rebootearth-backend"
version = "0.1.0"
description = "Backend del panel del productor por CAR (MapBiomas Alerta)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# B008: `Depends(...)` en argumentos es el patrón estándar de FastAPI.
ignore = ["B008"]

[tool.uv]
package = false
